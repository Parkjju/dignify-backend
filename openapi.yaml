openapi: 3.0.3
info:
  title: Dignify API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local
  - url: https://dignify-backend-co77gph5gq-uc.a.run.app
    description: Production (Cloud Run, us-central1)

tags:
  - name: Auth
  - name: Genres
  - name: Feed
  - name: Tracks
  - name: Users
  - name: ArtistRequests

paths:

  # ───────────────────────────────────────────
  # Auth
  # ───────────────────────────────────────────

  /auth/apple:
    post:
      tags: [Auth]
      summary: Apple Sign In
      description: >
        Apple identity token을 검증(Apple JWKS)하고 JWT를 발급한다.
        애플 프로바이더 기준 신규 유저면 가입 처리(랜덤 닉네임 자동 생성) 후 로그인.
        soft-delete된 유저가 재로그인하면 기존 연관 데이터를 cascade hard delete한 뒤 재가입 처리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken:
                  type: string
                  description: ASAuthorizationAppleIDCredential에서 받은 identity token
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    post:
      tags: [Auth]
      summary: Google Sign In (Android)
      description: >
        Google ID token을 검증(Google JWKS)하고 JWT를 발급한다. aud는 앱이 쓰는 "웹" OAuth 클라이언트
        ID(`GOOGLE_CLIENT_ID`)와 대조하며, 미설정이면 모든 요청이 401이다.
        구글 프로바이더 기준 신규면, **같은 이메일의 살아있는 계정이 있으면 그 계정에 인증수단만 추가(계정 연결)**하고
        없으면 가입 처리한다. 애플 "이메일 가리기" 계정은 이메일이 안 겹쳐 별도 계정이 된다.
        `email_verified`가 false거나 email이 비면 401(AUTH_EMAIL_NOT_VERIFIED) — 검증 안 된 이메일로
        남의 계정에 연결되는 것을 막는다.
        soft-delete된 유저가 재로그인하면 애플과 동일하게 cascade hard delete 후 재가입 처리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Android Credential Manager(GetGoogleIdOption)에서 받은 ID token
      responses:
        '200':
          description: 로그인/가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Access token 재발급
      description: 슬라이딩 윈도우 방식 — 호출마다 access token뿐 아니라 refresh token도 rotation되어 expires_at이 갱신된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: refresh token 해시로 user_tokens 1건을 삭제한다. 토큰이 이미 없어도 예외 없이 성공(idempotent).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 로그아웃 성공 (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/withdraw:
    post:
      tags: [Auth]
      summary: 계정 삭제 (soft delete)
      description: >
        refresh token으로 유저를 특정해 해당 유저의 모든 디바이스 user_tokens를 삭제하고 users.deleted_at을 채운다 (soft delete).
        users/user_auth 등 연관 레코드의 실제 삭제(cascade hard delete)는 동일 Apple ID로 재가입하는 시점에 처리된다 (정리 배치는 미구현, Post-MVP).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 탈퇴(soft delete) 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────────────────────
  # Genres
  # ───────────────────────────────────────────

  /genres:
    get:
      tags: [Genres]
      summary: 장르 목록 조회
      description: 온보딩 및 마이페이지 장르 설정 화면에서 사용한다.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 장르 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  genres:
                    type: array
                    items:
                      $ref: '#/components/schemas/Genre'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────────────────────
  # Feed
  # ───────────────────────────────────────────

  /feed:
    get:
      tags: [Feed]
      summary: 피드 조회
      description: >
        커서 기반 페이지네이션. 선호 장르 우선(Phase 1) → 전체 랜덤(Phase 2) 순으로 반환한다.
        cursor 미전달 시 첫 페이지 (서버가 새 seed 생성).
        cursor는 phase / genreOffset / generalOffset / seed를 포함한 opaque string이다.
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: >
            이전 응답의 nextCursor 값. 최초 요청 시 생략.
            내부 구조: { phase, genreOffset, generalOffset, seed } — 클라이언트는 불투명 문자열로 취급.
          schema:
            type: string
      responses:
        '200':
          description: 피드 조회 성공 (페이지 크기 10 고정, FeedService.FETCH_LIMIT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feed/search:
    get:
      tags: [Feed]
      summary: 트랙 검색
      description: >
        아티스트명 / 트랙명 LIKE 검색. 결과는 피드와 동일한 FeedResponse 구조로 반환한다.
        검색어 공백 시 API 호출 차단은 클라이언트 책임 (300ms 디바운스).
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor 값. 최초 요청 시 생략.
          schema:
            type: string
      responses:
        '200':
          description: 검색 결과 (페이지 크기 10 고정, FeedService.FETCH_LIMIT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────────────────────
  # Tracks
  # ───────────────────────────────────────────

  /tracks/{trackId}:
    get:
      tags: [Tracks]
      summary: 트랙 상세 조회
      description: 트랙 메타데이터 + 가장 먼저 하입한 유저 최대 5명을 반환한다.
      security:
        - BearerAuth: []
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 트랙 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tracks/{trackId}/hype:
    post:
      tags: [Tracks]
      summary: 트랙 하입
      security:
        - BearerAuth: []
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: 하입 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 하입한 트랙
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Tracks]
      summary: 트랙 하입 취소
      security:
        - BearerAuth: []
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 하입 취소 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 하입 기록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tracks/{trackId}/listen:
    post:
      tags: [Tracks]
      summary: 청취 행동 기록
      description: >
        클라이언트가 첫 재생에서 15초 이상 청취를 감지했을 때 호출한다.
        루프 재생은 클라이언트 책임으로 제외. 실패 시 재시도 없음 (fire-and-forget).
      security:
        - BearerAuth: []
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: 기록 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────────────────────
  # Users
  # ───────────────────────────────────────────

  /users/me:
    get:
      tags: [Users]
      summary: 내 프로필 조회
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/nickname:
    patch:
      tags: [Users]
      summary: 닉네임 변경
      description: 한글/영어만 허용, 최대 20자. return 키 또는 포커스 아웃 시 호출.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: 닉네임 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  nickname:
                    type: string
        '400':
          description: 유효하지 않은 닉네임 (특수문자, 숫자, 20자 초과 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 사용 중인 닉네임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/onboarding/complete:
    post:
      tags: [Users]
      summary: 온보딩 완료 처리
      description: >
        클라이언트가 온보딩 플로우(장르 선택, 튜토리얼 등)를 모두 마쳤을 때 호출한다.
        호출 시 서버가 무조건 is_onboarding_complete=true로 설정한다 (다시 false로 되돌리는 API는 없음 — 단방향).
        장르 선택(`PUT /users/me/genres`)과 분리된 별도 액션이다. 온보딩 단계가 늘어나도(튜토리얼 등) 이 엔드포인트 하나만 마지막에 호출하면 됨.
        멱등(idempotent) — 이미 완료된 유저가 다시 호출해도 동일하게 성공.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 온보딩 완료 처리 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/genres:
    put:
      tags: [Users]
      summary: 선호 장르 저장 / 변경
      description: >
        온보딩 중 장르 선택 화면 및 마이페이지 장르 재설정 시 사용한다.
        기존 user_genres를 모두 교체(replace)한다.
        빈 배열 허용 (장르 선택 없이 다음 단계로 진행 가능).
        온보딩 완료 처리는 이 API와 무관 — `POST /users/me/onboarding/complete`가 별도로 담당한다.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [genreIds]
              properties:
                genreIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  maxItems: 3
                  description: 선택한 장르 ID 목록 (0~3개)
      responses:
        '200':
          description: 저장 성공
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/hypes:
    get:
      tags: [Users]
      summary: 내가 하입한 트랙 목록 (마이페이지)
      description: >
        커서 기반 페이지네이션. 최신 하입 순으로 반환한다.
        날짜 기준 섹션 그룹핑은 클라이언트 책임 (hypedAt 필드 사용).
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: 마지막으로 받은 userHypeTrackId
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 하입 목록 조회 성공 (페이지 크기 10 고정, HypeService.PAGE_SIZE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/stats:
    get:
      tags: [Users]
      summary: 내 디깅 통계 (Digging Profile)
      description: >
        청취(listened_tracks)와 하입(users_hype_tracks)을 집계한 숫자만 반환한다.
        취향 유형·격차 헤드라인·잠금 판정은 전부 클라이언트가 이 숫자로 계산한다 (문구/임계값 변경에 서버 배포 불필요).
        모든 개수는 재생 횟수가 아니라 **곡 종류 수**(COUNT DISTINCT track_id)다 —
        listened_tracks는 append-only라 같은 곡이 여러 줄 쌓일 수 있다.
        genreName은 Accept-Language 로케일(ko/en)을 따르고, artistName은 한글 이름이 있으면 그것, 없으면 원어.
        아티스트 집계는 원어 이름 기준으로 묶는다 (한글 이름은 곡마다 채워져 파편화되므로).
      security:
        - BearerAuth: []
      parameters:
        - name: range
          in: query
          description: >
            `all`(기본) 또는 `week`. week은 달력상 이번 주가 아니라 **최근 7일**(now - 7 days).
            `week` 외의 값은 모두 전체 기간으로 처리한다.
          schema:
            type: string
            enum: [all, week]
            default: all
      responses:
        '200':
          description: 통계 조회 성공 (데이터가 없는 신규 유저는 0과 빈 배열 — 오류 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/device-token:
    post:
      tags: [Users]
      summary: APNs 디바이스 토큰 등록
      description: >
        푸시 알림 발송용 토큰을 등록한다. 같은 토큰을 다시 보내도 성공(멱등).
        environment로 개발/운영 APNs 서버를 가른다 — 값이 틀리면 알림이 조용히 안 간다.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, environment]
              properties:
                token:
                  type: string
                  description: APNs 디바이스 토큰 (hex 문자열)
                environment:
                  type: string
                  enum: [development, production]
      responses:
        '204':
          description: 등록 성공
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────────────────────
  # Artist Requests
  # ───────────────────────────────────────────

  /artist-requests:
    post:
      tags: [ArtistRequests]
      summary: 아티스트 등록 요청
      description: >
        "이 아티스트를 넣어달라"는 유저 요청. 검색 결과가 없을 때의 진입점이자 큐레이션 수요 신호다.
        처리는 수동 — 운영자가 곡을 수집한 뒤 상태를 ADDED로 바꾸면 요청자에게 푸시가 발송된다.
        중복 요청 검사는 없다 (같은 아티스트를 여러 번 요청 가능 — 수요 크기 자체가 신호).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artistName]
              properties:
                artistName:
                  type: string
                  maxLength: 100
                  description: 공백만으로는 불가(NotBlank). 서버에서 앞뒤 공백 제거 후 저장.
      responses:
        '201':
          description: 요청 접수됨 (status=PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [ArtistRequests]
      summary: 내 요청 목록
      description: 내가 낸 요청만 최신순으로 전부 반환한다 (페이지네이션 없음).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtistRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /artist-requests/{id}:
    delete:
      tags: [ArtistRequests]
      summary: 내 요청 취소
      description: >
        본인 요청만 삭제할 수 있다. 남의 요청 id를 넣으면 존재 여부를 숨기려고 404를 반환한다(403 아님).
        상태와 무관하게 삭제 가능.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 요청이 없거나 내 요청이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ───────────────────────────────────────────
# Components
# ───────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    AuthTokenResponse:
      type: object
      description: AuthService가 실제로 반환하는 형태 (com.rta.dignify.dto.auth.AuthTokenResponse)
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time

    Genre:
      type: object
      properties:
        genreId:
          type: integer
          format: int64
        genreName:
          type: string
          description: 표시용. Accept-Language 로케일에 따라 ko/en
        genreNameEn:
          type: string
          description: |
            매칭용 고정 키. 로케일과 무관하게 항상 영어명.
            genreName은 로케일에 따라 바뀌어 클라가 이름으로 대조할 수 없어 추가됨.

    FeedItem:
      type: object
      properties:
        trackId:
          type: integer
          format: int64
        trackName:
          type: string
        artistName:
          type: string
        artworkUrl:
          type: string
          description: 600x600bb 아트워크 URL (서버에서 100x100bb → 600x600bb 변환)
        previewUrl:
          type: string
          description: 30초 프리뷰 오디오 URL
        trackViewUrl:
          type: string
          description: Apple Music 링크 (서버에서 affiliate 토큰 append)
        genreName:
          type: string
          description: 트랙 장르명 (Accept-Language 로케일에 따라 ko/en)
        isHyped:
          type: boolean
          description: 현재 유저의 하입 여부

    FeedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 요청용 opaque cursor. hasMore=false일 때 포함 안 됨.
        hasMore:
          type: boolean
          description: 추가 페이지 존재 여부. false면 피드 소진.
        genreExhausted:
          type: boolean
          description: >
            선호 장르 트랙이 소진돼 장르 밖 트랙(GENERAL)으로 채운 페이지인지 여부.
            순수 장르 페이지와 검색 응답은 false. 장르가 없는 게스트는 항상 true.

    UserStatsResponse:
      type: object
      properties:
        range:
          type: string
          description: 요청받은 range를 그대로 반환
        distinctListenedCount:
          type: integer
          format: int64
          description: 들은 곡 종류 수. listenedByGenre의 count 합과 일치한다(곡 하나에 장르 하나).
        hypeCount:
          type: integer
          format: int64
          description: 담은 곡 수. hypedByGenre의 count 합과 일치.
        listenedByGenre:
          type: array
          description: 장르별 들은 곡 수. 전체 장르(잘라내지 않음), count 내림차순 → 이름 오름차순.
          items:
            $ref: '#/components/schemas/GenreCount'
        hypedByGenre:
          type: array
          description: 장르별 담은 곡 수. 전체 장르.
          items:
            $ref: '#/components/schemas/GenreCount'
        listenedByArtist:
          type: array
          description: 아티스트별 들은 곡 수. **상위 5개만** (전체 합계 계산에 쓸 수 없음).
          items:
            $ref: '#/components/schemas/ArtistCount'
        hypedByArtist:
          type: array
          description: 아티스트별 담은 곡 수. 상위 5개만.
          items:
            $ref: '#/components/schemas/ArtistCount'

    GenreCount:
      type: object
      properties:
        genreName:
          type: string
          description: Accept-Language 로케일에 따라 ko/en
        count:
          type: integer
          format: int64

    ArtistCount:
      type: object
      properties:
        artistName:
          type: string
          description: ko 로케일이면 한글 이름, 없으면 원어로 폴백
        count:
          type: integer
          format: int64

    ArtistRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        artistName:
          type: string
        status:
          type: string
          enum: [PENDING, ADDED, CANCELED]
          description: PENDING 접수됨 / ADDED 수집 완료(요청자에게 푸시 발송됨) / CANCELED 거절
        cancelReason:
          type: string
          nullable: true
          description: >
            CANCELED일 때만 채워진다. 서버가 쓴 문장이 그대로 노출되며 번역되지 않는다.
            (ADDED에도 값을 넣을 수는 있지만 클라이언트가 표시하지 않음)
        createdAt:
          type: string
          format: date-time

    TrackDetail:
      type: object
      properties:
        trackId:
          type: integer
          format: int64
        trackName:
          type: string
        artistName:
          type: string
        collectionName:
          type: string
        artworkUrl:
          type: string
        trackViewUrl:
          type: string
        releaseDate:
          type: string
          format: date
        genreName:
          type: string
        firstHypers:
          type: array
          maxItems: 5
          description: 가장 먼저 하입한 순 최대 5명
          items:
            $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        hypedAt:
          type: string
          format: date-time
          description: 하입한 시각

    UserProfile:
      type: object
      properties:
        nickname:
          type: string
        isOnboardingComplete:
          type: boolean
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'

    HypeItem:
      type: object
      properties:
        userHypeTrackId:
          type: integer
          format: int64
        trackId:
          type: integer
          format: int64
        trackName:
          type: string
        artistName:
          type: string
        artworkUrl:
          type: string
        previewUrl:
          type: string
        hypedAt:
          type: string
          format: date-time
          description: 하입 시각 (클라이언트에서 날짜 기준 섹션 그룹핑에 사용)

    HypeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HypeItem'
        nextCursor:
          type: integer
          format: int64
          nullable: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: "에러 식별 코드 (예: NICKNAME_DUPLICATE, INVALID_NICKNAME, TOKEN_EXPIRED)"
        message:
          type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 필요 또는 토큰 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
