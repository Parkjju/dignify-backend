spring.application.name=dignify

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dignify}}
spring.datasource.username=${DB_USERNAME:dignify}
spring.datasource.password=${DB_PASSWORD:dignify}
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=600000
# db-f1-micro의 max_connections는 25이고 그중 2개는 Cloud SQL 관리용(cloudsqladmin)이 늘 쓴다.
# 기본값 10을 두면 Cloud Run 인스턴스 하나가 10개를 잡아, 라이브와 로컬 크론이 같이 돌 때
# 실측으로 20개까지 올라갔다(한도의 80%). 인스턴스가 셋만 떠도 넘긴다.
# 실측 동시 요청은 최대 4건이고 요청 하나가 연결을 쥐는 시간은 15ms라 5로도 넘치게 남는다.
spring.datasource.hikari.maximum-pool-size=5
# Cloud Run은 요청을 처리하는 동안에만 CPU를 준다(실측 유휴 CPU 1%). 기본값이면 minimum-idle이
# maximum-pool-size와 같아서, Hikari가 유휴 시간에 백그라운드로 연결 5개를 계속 채우려 한다.
# 그 CPU로는 Cloud SQL과 SSL 핸드셰이크를 못 끝내 Broken pipe가 나고("Pool is empty" 경고가
# 75초마다 반복) 풀이 5개→1개로 마른다. 그 뒤 들어온 첫 요청이 연결을 맨바닥부터 만들다
# /feed가 6.79초 걸렸다(2026-08-11 04:53:56 UTC).
# 0으로 두면 연결 생성이 요청 처리 중에만 일어난다 — CPU가 살아있는 유일한 시점이다.
# 유휴 뒤 첫 요청은 연결 생성 비용을 문다. 그건 dignify-keepalive 스케줄러가 5분마다
# /feed를 때려서 대신 물어준다.
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

# Google Sign-In (안드로이드)
# 안드로이드 앱이 Credential Manager에 넘기는 "웹" OAuth 클라이언트 ID. 구글이 발급하는 ID 토큰의
# aud가 이 값이라 여기가 비면 /auth/google이 전부 401이 된다(기동은 정상 — 미설정 상태로도 배포는 돼야 함).
google.client-id=${GOOGLE_CLIENT_ID:}

# APNs
apns.key-p8=${APNS_KEY_P8}
apns.key-id=${APNS_KEY_ID}
apns.team-id=${APNS_TEAM_ID}
apns.bundle-id=${APNS_BUNDLE_ID}

# FCM (안드로이드)
# 기본이 false인 게 중요하다 — 서비스 계정 키를 아직 안 넣은 환경에서도 기동은 돼야 하고,
# 꺼져 있어도 iOS 발송은 그대로다(안드로이드 토큰만 건너뛴다).
fcm.enabled=${FCM_ENABLED:false}
fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}

# Cron
cron.secret=${CRON_SECRET}

# 어드민 화면(/internal/admin.html)이 쓰는 시크릿. 안 주면 크론 시크릿으로 떨어져 종전대로 동작한다 —
# 환경변수를 먼저 안 넣어도 배포가 죽지 않게 하려는 것이고, 떨어질 때 기동 로그에 경고가 찍힌다.
admin.secret=${ADMIN_SECRET:${cron.secret}}
