spring.application.name=dignify
jwt.secret=dzKVMJiPlHwSKRIib5vMTYXMTkLFREb4Hzds5CSFcMX
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000
cron.secret=test-cron-secret
# 테스트도 로컬 docker-compose Postgres 사용 (H2는 cascade/flush순서/제약 동작이 실제와 달라 폐기)
# 실행 전 `docker compose up -d postgres` 필요.
# DB는 개발 앱(dignify)과 분리된 dignify_test다 — ddl-auto=create-drop이라 같은 DB를 쓰면
# 테스트가 끝나며 개발 데이터를 통째로 드롭한다(2026-08-22에 실제로 날렸다).
# 없으면: docker compose exec postgres psql -U dignify -d dignify -c 'CREATE DATABASE dignify_test'
spring.datasource.url=jdbc:postgresql://localhost:5432/dignify_test
spring.datasource.username=dignify
spring.datasource.password=dignify
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
admin.secret=test-admin-secret

# track_vectors는 엔티티가 없어 ddl-auto(create-drop)가 못 만든다. 운영과 같은 DDL 파일을 쓴다.
# data.sql은 일부러 빼둔다 — 장르 426줄을 테스트마다 넣을 이유가 없고, 각 테스트가 필요한 장르를 직접 만든다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:track-vectors.sql
